{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | HELPHOP</title>

    <link rel="stylesheet" href="{% static 'helphop/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'helphop/css/signup.css' %}">

    <style>
        .back-home{
            border: 1px solid rgba(240, 248, 255, 0.284);
            padding-top: 5px;
            padding-bottom: 5px;
            padding-left: 35px;
            padding-right: 40px;
            background-color: rgba(240, 248, 255, 0.284);
            border-radius: 18px;
            font-size: 18px;
            color: inherit;
            text-decoration: none;
        }
        .back-home:hover{
            background-color: rgba(240, 248, 255, 0.574);
        }
        .back-home:hover,
        .back-home:focus,
        .back-home:active {
            color: inherit;
            text-decoration: none;
        }

        .site-logo{
            margin-top: 100px;
            display: inline-block;
        }


    </style>

</head>

<body>
    <div class="wrapper">

        <a href="{% url 'landing' %}" class="site-logo">
            <img src="{% static 'helphop/images/logo.svg' %}" alt="HELPHOP" style="height: 60px; margin-left: -1232px; position: relative; top: -13px;">
        </a>

        <form method="post" id="form" action="{% url 'register' %}">
            {% csrf_token %}

            {% if form.errors %}
                <div style="color:red; margin-bottom:10px;">
                    {{ form.errors }}
                </div>
            {% endif %}

            <h1>Sign Up</h1>
            <div class="user-type-group">
                <span>I am signing in as</span>
                <div class="user-type-options">
                    <input type="radio" name="user_type" id="login-customer" value="customer" required>
                    <label for="login-customer" class="radio-customer">Customer</label>

                    <input type="radio" name="user_type" id="login-worker" value="worker">
                    <label for="login-worker" class="radio-worker">Worker</label>
                </div>
            </div>

            <div>
                <label>
                    <img src="{% static 'helphop/images/person.png' %}" alt="person">
                </label>
                <input type="text" name="first_name" placeholder="First Name" required>
            </div>

            <div>
                <label>
                    <img src="{% static 'helphop/images/person.png' %}" alt="person">
                </label>
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>

            <div>
                <label>
                    <img src="{% static 'helphop/images/phone.png' %}" alt="phone">
                </label>
                <input type="text" name="phone" placeholder="Phone Number" required>
            </div>

            <div>
                <label><span>@</span></label>
                <input type="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div>
                <label>
                    <img src="{% static 'helphop/images/lock.png' %}" alt="lock">
                </label>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div>
                <label>
                    <img src="{% static 'helphop/images/lock.png' %}" alt="lock">
                </label>
                <input type="password" name="password_confirm" placeholder="Repeat password" required>
            </div>

            <button type="submit">Sign Up</button>

            <p class="form-actions">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>
        </form>

        <a href="{% url 'landing' %}" class="back-home" style="color: white;">← Back</a>

    </div>

</body>

</html>
