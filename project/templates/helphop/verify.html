{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | HELPHOP</title>

    <style>
        /* PAGE BACKGROUND  */
        body {
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: linear-gradient(135deg, #e0f2ff, #c7ddff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*CARD */
        .verify-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .verify-card h2 {
            margin-bottom: 8px;
            font-size: 26px;
            color: #0f172a;
        }

        .verify-card p.subtitle {
            margin-bottom: 24px;
            color: #475569;
            font-size: 15px;
        }

        /* MESSAGES  */
        .messages p {
            background: #eef2ff;
            color: #1e3a8a;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        /*  FORM */
        form {
            margin-top: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #334155;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5f5;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        input[type="text"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /*  BUTTON  */
        button {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="verify-card">
        <h2>Verify Your Email</h2>
        <p class="subtitle">
            Enter the 6-digit OTP sent to your email address.
        </p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="otp">Enter OTP</label>
            <input type="text" name="otp" id="otp" maxlength="6" required>

            <button type="submit">Verify</button>
        </form>
    </div>

</body>

</html>
